name: Release

# Full pipeline. Runs ONLY on version tags and on manual dispatch.
# There is deliberately no push trigger on main and no schedule.
# Policy: docs/decisions/0005-ci-policy.md
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed release artifacts (otherwise debug build only)"
        type: boolean
        default: false

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Fails immediately if the git tag and pubspec.yaml version disagree.
      # This is why version and tag can never drift.
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: dart run tool/verify_version.dart --tag "${GITHUB_REF_NAME}"

      - name: Verify asset checksums
        run: dart run tool/verify_checksums.dart

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Verify architectural layering
        run: dart run tool/verify_layering.dart

      - name: Test (including golden)
        run: flutter test

  build:
    name: Build Android
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Signing config is absent on forks and on dispatch runs that do not
      # request a release build; those fall back to a debug-signed build.
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Configure signing (Batch 0.6)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Write signing properties
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # Unsigned iOS build. Signing, TestFlight upload, and App Store submission
  # are added in Batch 11.1 once the Apple Developer Program is enrolled.
  # Until then this only proves the iOS target still compiles (ADR 0007).
  build-ios:
    name: Build iOS
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS
        run: flutter build ios --release --no-codesign

  release:
    name: Publish GitHub Release
    needs: [build, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the section between this version's heading and the next one.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[?" ver "\\]?" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for $VERSION"
            echo "Release $GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/flutter-apk/app-release.apk
            artifacts/bundle/release/app-release.aab
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
